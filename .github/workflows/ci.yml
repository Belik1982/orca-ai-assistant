name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Validate locale JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          locales_dir = Path("src/orca_ai_assistant/assets/locales")
          for code in ("ru", "uk", "en"):
              path = locales_dir / f"{code}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict) and data, f"Invalid locale file: {path}"
              print(f"OK {path}: {len(data)} keys")
          PY

      - name: Syntax-check frontend JavaScript
        run: |
          node --check src/orca_ai_assistant/ui/markdown.js
          node --check src/orca_ai_assistant/ui/app.js

      - name: Run unit tests
        run: pytest

      - name: Verify single-file bundle is up to date
        run: python scripts/build_singlefile.py --check

      - name: Compile-check single-file bundle
        run: python -m py_compile orca_ai_assistant_any.py

      - name: Smoke-import single-file bundle in isolated mode
        run: |
          python -I - <<'PY'
          import importlib.util
          import tomllib
          from pathlib import Path

          expected_ver = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          bundle_path = Path("orca_ai_assistant_any.py").resolve()
          spec = importlib.util.spec_from_file_location("orca_ai_assistant_any", bundle_path)
          mod = importlib.util.module_from_spec(spec)
          assert spec is not None and spec.loader is not None
          spec.loader.exec_module(mod)
          assert getattr(mod, "PLUGIN_VERSION", "") == expected_ver, (getattr(mod, "PLUGIN_VERSION", ""), expected_ver)
          html = mod.load_ui_html("dock")
          assert 'data-view="dock"' in html
          print("OK isolated bundle import:", mod.PLUGIN_VERSION, len(html), "bytes HTML")
          PY
