[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-ai-assistant"
version = "3.1.0"
description = "Multilingual (EN / UA / RU) interactive AI co-pilot & built-in MCP server for OrcaSlicer 2.5+: 3D geometry & overhang analysis, deterministic Pre-Flight scorecard, multi-slot AMS awareness, Custom G-code diff & safety linter, 1-click apply with Undo & Preset Snapshots, Defect & Calibration wizards, and 13+ AI providers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Anton & Antigravity" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orca_ai_assistant = [
    "assets/*.svg",
    "assets/locales/*.json",
    "ui/*.html",
    "ui/*.css",
    "ui/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
